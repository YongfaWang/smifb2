name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kernel ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: "5.4"
            image: ubuntu:20.04
            headers: linux-headers-generic
          - kernel: "5.10"
            image: debian:bullseye
            headers: linux-headers-amd64
          - kernel: "5.15"
            image: ubuntu:22.04
            headers: linux-headers-generic
          - kernel: "6.1"
            image: debian:bookworm
            headers: linux-headers-amd64
          - kernel: "7.0"
            image: vicamo/mainline-kernel-headers:7.0
            headers: ""
          - kernel: "7.1"
            image: vicamo/mainline-kernel-headers:7.1
            headers: ""
          # Ubuntu 26.10 (Stonking) ships the 7.3 kernel and publishes the
          # matching headers as linux-headers-7.3.0-9-generic.
          - kernel: "7.3"
            image: ubuntu:26.10
            headers: linux-headers-7.3.0-9-generic

    # GitHub runs every step in this job inside the selected Docker image.
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Configure Debian 11 snapshot repositories
        if: matrix.kernel == '5.10'
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260901T000000Z bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main' \
            > /etc/apt/sources.list
          if [ -d /etc/apt/sources.list.d ]; then
            find /etc/apt/sources.list.d -type f -delete
          fi

      - name: Install build tools and headers
        env:
          DEBIAN_FRONTEND: noninteractive
          HEADER_PACKAGE: ${{ matrix.headers }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            file \
            git \
            kmod \
            ${HEADER_PACKAGE}
          rm -rf /var/lib/apt/lists/*

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select kernel headers
        env:
          EXPECTED_KERNEL: ${{ matrix.kernel }}
        run: |
          # Prefer a prepared /lib/modules/<ver>/build tree.  Distribution
          # header packages (e.g. Ubuntu's linux-headers-7.3.0-9-generic)
          # only ship /usr/src/linux-headers-<ver>, so fall back to that.
          KVER="$({
            for directory in /lib/modules/*; do
              [ -d "${directory}/build" ] && basename "${directory}"
            done
          } | sort -V | tail -n 1)"

          if [ -z "${KVER}" ]; then
            KVER="$({
              for directory in /usr/src/linux-headers-*; do
                [ -d "${directory}" ] && basename "${directory}" | sed 's/^linux-headers-//'
              done
            } | sort -V | tail -n 1)"

            if [ -n "${KVER}" ]; then
              mkdir -p "/lib/modules/${KVER}"
              ln -sfn "/usr/src/linux-headers-${KVER}" "/lib/modules/${KVER}/build"
            fi
          fi

          if [ -z "${KVER}" ]; then
            echo "No prepared kernel headers found under /lib/modules or /usr/src" >&2
            exit 1
          fi

          case "${KVER}" in
            "${EXPECTED_KERNEL}".*|"${EXPECTED_KERNEL}"-*) ;;
            *)
              echo "Expected kernel ${EXPECTED_KERNEL}.x, found ${KVER}" >&2
              exit 1
              ;;
          esac

          echo "KVER=${KVER}" >> "${GITHUB_ENV}"
          echo "Building against /lib/modules/${KVER}/build"

      - name: Build driver
        run: |
          make KVER="${KVER}" clean
          make KVER="${KVER}" -j"$(nproc)"

      - name: Verify module
        run: |
          test -s smifb.ko
          file smifb.ko
          modinfo smifb.ko
          modinfo -F vermagic smifb.ko | grep -F "${KVER}"

      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: smifb-kernel-${{ matrix.kernel }}
          path: smifb.ko
          if-no-files-found: error
          retention-days: 30

  build-6-6:
    name: Kernel 6.6
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build in Alpine 3.19 Docker container
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            alpine:3.19 \
            sh -euxc '
              apk add --no-cache build-base file kmod linux-lts-dev

              KVER="$({
                for directory in /lib/modules/*; do
                  [ -d "${directory}/build" ] && basename "${directory}"
                done
              } | sort -V | tail -n 1)"

              case "${KVER}" in
                6.6.*|6.6-*) ;;
                *)
                  echo "Expected kernel 6.6.x, found ${KVER}" >&2
                  exit 1
                  ;;
              esac

              echo "Building against /lib/modules/${KVER}/build"
              make KVER="${KVER}" clean
              make KVER="${KVER}" -j"$(nproc)"

              test -s smifb.ko
              file smifb.ko
              modinfo smifb.ko
              modinfo -F vermagic smifb.ko | grep -F "${KVER}"
            '

      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: smifb-kernel-6.6
          path: smifb.ko
          if-no-files-found: error
          retention-days: 30

  offline-scripts:
    name: Offline scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check line endings
        run: |
          # A CRLF script makes the kernel refuse to run it with
          # "bad interpreter: /bin/bash^M".
          if grep -Il $'\r' offline-arm64/*.sh 2>/dev/null | grep .; then
            echo "::error file=offline-arm64::CRLF line endings found in the shell scripts"
            exit 1
          fi
          echo "no CRLF line endings"

      - name: Check the scripts are executable
        run: |
          # The scripts are run as "./build-install.sh" on the target
          # machine, so they must carry the executable bit in the index.
          for script in offline-arm64/*.sh; do
            mode="$(git ls-files -s "${script}" | awk '{print $1}')"
            if [ "${mode}" != "100755" ]; then
              echo "::error file=${script}::mode is ${mode}, expected 100755"
              exit 1
            fi
            echo "${script}: ${mode}"
          done

      - name: Syntax check with bash -n
        run: |
          for script in offline-arm64/*.sh; do
            echo "checking ${script}"
            bash -n "${script}"
            echo "  syntax OK"
          done

      - name: Shellcheck
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning offline-arm64/*.sh || true

      - name: Run build-install.sh in a container
        run: |
          # Exercise the real script in a real Ubuntu 26.10 container.
          #
          # The source tree is produced with "git archive" because the
          # release tarball under offline-arm64/src/ is gitignored.
          #
          # The script is expected to fail at the "no kernel headers"
          # stage.  That proves it runs, reports the reason clearly and
          # exits non-zero without touching /lib/modules.
          rm -rf "${RUNNER_TEMP}/work"
          mkdir -p "${RUNNER_TEMP}/work"
          git archive --format=tar --prefix=smifb2-2.6.0/ HEAD | \
            tar -x -C "${RUNNER_TEMP}/work"
          cp -r offline-arm64 "${RUNNER_TEMP}/work/"
          chmod +x "${RUNNER_TEMP}/work/offline-arm64/"*.sh

          set +e
          docker run --rm \
            --volume "${RUNNER_TEMP}/work:/work" \
            --workdir /work/smifb2-2.6.0 \
            ubuntu:26.10 \
            bash -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential file kmod >/dev/null

              # The running kernel headers are deliberately not installed
              # here (the stock ubuntu:26.10 image has no linux-headers
              # package), so the script has to fail with a clear message.
              output="$(/work/offline-arm64/build-install.sh 2>&1)"
              status=$?
              echo "${output}"

              if [ "${status}" -eq 0 ]; then
                echo "UNEXPECTED: build-install.sh succeeded without kernel headers"
                exit 1
              fi

              # The failure message has to mention the headers, otherwise the
              # script did not fail for the reason we expect.
              case "${output}" in
                *"Kernel headers"*) ;;
                *)
                  echo "UNEXPECTED: failure message does not mention the kernel headers"
                  exit 1
                  ;;
              esac

              # The script must not have left anything behind in
              # /lib/modules for the running kernel.
              if [ -e "/lib/modules/$(uname -r)/updates/dkms/smifb.ko" ]; then
                echo "UNEXPECTED: the script installed a module despite failing"
                exit 1
              fi
              echo "build-install.sh failed with a clear message and left no residue (good)"
            '
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::the container run itself failed (exit ${status})"
            exit "${status}"
          fi

      - name: Run diagnose.sh in a container
        run: |
          # diagnose.sh must always run to completion, even when there is no
          # GPU, no driver and no /dev/dri.
          set +e
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --workdir /src \
            ubuntu:26.10 \
            bash -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends kmod >/dev/null
              bash /src/offline-arm64/diagnose.sh
            '
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::diagnose.sh exited with ${status}"
            exit "${status}"
          fi
          echo "diagnose.sh completed successfully"

  arm64-offline-e2e:
    name: ARM64 offline end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Verify arm64 emulation
        run: |
          docker run --rm --platform linux/arm64 ubuntu:26.10 uname -m

      - name: Build the offline bundle
        run: |
          # Reproduce what the user copies onto the USB stick: the driver
          # source, the arm64 kernel headers and the complete gcc/make
          # dependency closure, all as .deb files.
          set -euo pipefail
          WORK="${RUNNER_TEMP}/bundle"
          mkdir -p "${WORK}/offline-arm64/debs" "${WORK}/offline-arm64/src"

          # 1. the driver source
          git archive --format=tar.gz --prefix=smifb2-2.6.0/ \
            -o "${WORK}/offline-arm64/src/smifb2-2.6.0.tar.gz" HEAD

          # 2. the scripts and the documentation
          cp offline-arm64/*.sh offline-arm64/*.md \
             offline-arm64/SHA256SUMS "${WORK}/offline-arm64/"
          chmod +x "${WORK}/offline-arm64/"*.sh

          # 3. the arm64 kernel headers (both packages are required)
          BASE=https://mirrors.aliyun.com/ubuntu/pool/main/l/linux
          curl -sSL -o "${WORK}/offline-arm64/debs/linux-headers-7.3.0-9_7.3.0-9.9_all.deb" \
            "${BASE}/linux-headers-7.3.0-9_7.3.0-9.9_all.deb"
          curl -sSL -o "${WORK}/offline-arm64/debs/linux-headers-7.3.0-9-generic_7.3.0-9.9_arm64.deb" \
            "${BASE}/linux-headers-7.3.0-9-generic_7.3.0-9.9_arm64.deb"

          # 4. the gcc/make dependency closure
          curl -sSL -o "${WORK}/closure.json" \
            "https://raw.githubusercontent.com/YongfaWang/smifb2/main/offline-arm64/toolchain-manifest.json"
          python3 - "${WORK}/closure.json" "${WORK}/offline-arm64/debs" <<'PY'
          import json, os, sys, urllib.request
          manifest = json.load(open(sys.argv[1]))
          dest = sys.argv[2]
          base = "https://mirrors.aliyun.com/ubuntu/"
          for item in manifest:
              name = item["filename"].split("/")[-1]
              target = os.path.join(dest, name)
              if os.path.exists(target) and os.path.getsize(target) == item["size"]:
                  continue
              print("fetching", name, flush=True)
              req = urllib.request.Request(base + item["filename"],
                                           headers={"User-Agent": "curl/8"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  data = r.read()
              assert len(data) == item["size"], name
              open(target, "wb").write(data)
          PY

          # 5. checksums
          cd "${WORK}/offline-arm64"
          sha256sum debs/*.deb src/*.tar.gz > SHA256SUMS

          echo "bundle size:"
          du -sh "${WORK}/offline-arm64"
          ls "${WORK}/offline-arm64/debs" | wc -l

      - name: Install and build in an arm64 container without network
        run: |
          # This is the exact scenario the user is worried about: an arm64
          # machine with no network access, no compiler and no kernel
          # headers.  The container is started with --network none, so
          # nothing can be downloaded.
          set -euo pipefail
          WORK="${RUNNER_TEMP}/bundle"

          docker run --rm \
            --platform linux/arm64 \
            --network none \
            --volume "${WORK}:/bundle:ro" \
            --workdir /work \
            ubuntu:26.10 \
            bash -euxc '
              mkdir -p /work
              cp -r /bundle/offline-arm64 /work/
              cd /work/offline-arm64

              # ---- the machine starts with no compiler ----
              echo "== before =="
              command -v gcc || echo "gcc: not installed"
              command -v make || echo "make: not installed"
              ls /usr/src/linux-headers-* 2>/dev/null || echo "no kernel headers"

              # ---- step 1: install the offline toolchain ----
              echo "== installing the offline toolchain =="
              ./install-toolchain.sh

              echo "== after =="
              gcc --version | head -1
              make --version | head -1
              modinfo --version | head -1

              # ---- step 2: install the kernel headers ----
              echo "== installing the kernel headers =="
              DEBIAN_FRONTEND=noninteractive dpkg -i debs/linux-headers-7.3.0-9_*.deb || true
              DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
              ls -d /usr/src/linux-headers-*

              # ---- step 3: build and install the driver ----
              # The container runs on the CI host kernel, so uname -r does
              # not match the headers we just installed.  KVER has to be
              # set explicitly, exactly like it would be on a machine
              # whose running kernel is 7.3.0-9-generic.
              echo "== building the driver =="
              tar xzf src/smifb2-2.6.0.tar.gz
              cd smifb2-2.6.0
              export KVER=7.3.0-9-generic
              ../build-install.sh

              # ---- step 4: verify the module ----
              echo "== verifying =="
              test -s smifb.ko
              file smifb.ko
              modinfo smifb.ko
              modinfo -F vermagic smifb.ko
              modinfo -F vermagic smifb.ko | grep -F "${KVER}"
              test -s /lib/modules/"${KVER}"/updates/dkms/smifb.ko
              echo "the arm64 module was built and installed"

              # ---- step 5: the diagnostics script has to run ----
              cd /work/offline-arm64
              ./diagnose.sh
            '

  code-quality:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        continue-on-error: true
        run: cppcheck --enable=all --suppress=missingIncludeSystem .
