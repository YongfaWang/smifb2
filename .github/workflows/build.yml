name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kernel ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: "5.4"
            image: ubuntu:20.04
            headers: linux-headers-generic
          - kernel: "5.10"
            image: debian:bullseye
            headers: linux-headers-amd64
          - kernel: "5.15"
            image: ubuntu:22.04
            headers: linux-headers-generic
          - kernel: "6.1"
            image: debian:bookworm
            headers: linux-headers-amd64
          - kernel: "7.0"
            image: vicamo/mainline-kernel-headers:7.0
            headers: ""
          - kernel: "7.1"
            image: vicamo/mainline-kernel-headers:7.1
            headers: ""
          # Ubuntu 26.10 (Stonking) ships the 7.3 kernel and publishes the
          # matching headers as linux-headers-7.3.0-9-generic.
          - kernel: "7.3"
            image: ubuntu:26.10
            headers: linux-headers-7.3.0-9-generic

    # GitHub runs every step in this job inside the selected Docker image.
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Configure Debian 11 snapshot repositories
        if: matrix.kernel == '5.10'
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260901T000000Z bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main' \
            > /etc/apt/sources.list
          if [ -d /etc/apt/sources.list.d ]; then
            find /etc/apt/sources.list.d -type f -delete
          fi

      - name: Install build tools and headers
        env:
          DEBIAN_FRONTEND: noninteractive
          HEADER_PACKAGE: ${{ matrix.headers }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            file \
            git \
            kmod \
            ${HEADER_PACKAGE}
          rm -rf /var/lib/apt/lists/*

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select kernel headers
        env:
          EXPECTED_KERNEL: ${{ matrix.kernel }}
        run: |
          # Prefer a prepared /lib/modules/<ver>/build tree.  Distribution
          # header packages (e.g. Ubuntu's linux-headers-7.3.0-9-generic)
          # only ship /usr/src/linux-headers-<ver>, so fall back to that.
          KVER="$({
            for directory in /lib/modules/*; do
              [ -d "${directory}/build" ] && basename "${directory}"
            done
          } | sort -V | tail -n 1)"

          if [ -z "${KVER}" ]; then
            KVER="$({
              for directory in /usr/src/linux-headers-*; do
                [ -d "${directory}" ] && basename "${directory}" | sed 's/^linux-headers-//'
              done
            } | sort -V | tail -n 1)"

            if [ -n "${KVER}" ]; then
              mkdir -p "/lib/modules/${KVER}"
              ln -sfn "/usr/src/linux-headers-${KVER}" "/lib/modules/${KVER}/build"
            fi
          fi

          if [ -z "${KVER}" ]; then
            echo "No prepared kernel headers found under /lib/modules or /usr/src" >&2
            exit 1
          fi

          case "${KVER}" in
            "${EXPECTED_KERNEL}".*|"${EXPECTED_KERNEL}"-*) ;;
            *)
              echo "Expected kernel ${EXPECTED_KERNEL}.x, found ${KVER}" >&2
              exit 1
              ;;
          esac

          echo "KVER=${KVER}" >> "${GITHUB_ENV}"
          echo "Building against /lib/modules/${KVER}/build"

      - name: Build driver
        run: |
          make KVER="${KVER}" clean
          make KVER="${KVER}" -j"$(nproc)"

      - name: Verify module
        run: |
          test -s smifb.ko
          file smifb.ko
          modinfo smifb.ko
          modinfo -F vermagic smifb.ko | grep -F "${KVER}"

      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: smifb-kernel-${{ matrix.kernel }}
          path: smifb.ko
          if-no-files-found: error
          retention-days: 30

  build-6-6:
    name: Kernel 6.6
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build in Alpine 3.19 Docker container
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            alpine:3.19 \
            sh -euxc '
              apk add --no-cache build-base file kmod linux-lts-dev

              KVER="$({
                for directory in /lib/modules/*; do
                  [ -d "${directory}/build" ] && basename "${directory}"
                done
              } | sort -V | tail -n 1)"

              case "${KVER}" in
                6.6.*|6.6-*) ;;
                *)
                  echo "Expected kernel 6.6.x, found ${KVER}" >&2
                  exit 1
                  ;;
              esac

              echo "Building against /lib/modules/${KVER}/build"
              make KVER="${KVER}" clean
              make KVER="${KVER}" -j"$(nproc)"

              test -s smifb.ko
              file smifb.ko
              modinfo smifb.ko
              modinfo -F vermagic smifb.ko | grep -F "${KVER}"
            '

      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: smifb-kernel-6.6
          path: smifb.ko
          if-no-files-found: error
          retention-days: 30

  offline-scripts:
    name: Offline scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check line endings
        run: |
          # A CRLF script makes the kernel refuse to run it with
          # "bad interpreter: /bin/bash^M".
          if grep -Il $'\r' offline-arm64/*.sh 2>/dev/null | grep .; then
            echo "::error file=offline-arm64::CRLF line endings found in the shell scripts"
            exit 1
          fi
          echo "no CRLF line endings"

      - name: Syntax check with bash -n
        run: |
          for script in offline-arm64/*.sh; do
            echo "checking ${script}"
            bash -n "${script}"
            echo "  syntax OK"
          done

      - name: Shellcheck
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning offline-arm64/*.sh || true

      - name: Run build-install.sh in a container
        run: |
          # Exercise the real script in a real Ubuntu 26.10 container.
          #
          # The source tree is produced with "git archive" because the
          # release tarball under offline-arm64/src/ is gitignored.
          #
          # The script is expected to fail at the "no kernel headers"
          # stage.  That proves it runs, reports the reason clearly and
          # exits non-zero without touching /lib/modules.
          git archive --format=tar --prefix=smifb2-2.6.0/ HEAD | \
            tar -x -C "${RUNNER_TEMP}"
          cp -r offline-arm64 "${RUNNER_TEMP}/"

          set +e
          docker run --rm \
            --volume "${RUNNER_TEMP}:/work" \
            --workdir /work/smifb2-2.6.0 \
            ubuntu:26.10 \
            bash -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential file kmod >/dev/null

              # The running kernel headers are deliberately not installed
              # here (the stock ubuntu:26.10 image has no linux-headers
              # package), so the script has to fail with a clear message.
              output="$(../build-install.sh 2>&1)"
              status=$?
              echo "${output}"

              if [ "${status}" -eq 0 ]; then
                echo "UNEXPECTED: build-install.sh succeeded without kernel headers"
                exit 1
              fi

              # The failure message has to mention the headers, otherwise the
              # script did not fail for the reason we expect.
              case "${output}" in
                *"Kernel headers"*) ;;
                *)
                  echo "UNEXPECTED: failure message does not mention the kernel headers"
                  exit 1
                  ;;
              esac

              # The script must not have left anything behind in
              # /lib/modules for the running kernel.
              if [ -e "/lib/modules/$(uname -r)/updates/dkms/smifb.ko" ]; then
                echo "UNEXPECTED: the script installed a module despite failing"
                exit 1
              fi
              echo "build-install.sh failed with a clear message and left no residue (good)"
            '
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::the container run itself failed (exit ${status})"
            exit "${status}"
          fi

      - name: Run diagnose.sh in a container
        run: |
          # diagnose.sh must always run to completion, even when there is no
          # GPU, no driver and no /dev/dri.
          set +e
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --workdir /src \
            ubuntu:26.10 \
            bash -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends kmod >/dev/null
              bash /src/offline-arm64/diagnose.sh
            '
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::diagnose.sh exited with ${status}"
            exit "${status}"
          fi
          echo "diagnose.sh completed successfully"

  code-quality:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        continue-on-error: true
        run: cppcheck --enable=all --suppress=missingIncludeSystem .
